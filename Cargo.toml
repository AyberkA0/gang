[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/AyberkA0/gang"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
directories = "6"
fd-lock = "4"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
notify = "8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
unicode-normalization = "0.1"
ureq = { version = "3", features = ["json"] }

gang-core = { path = "crates/gang-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
